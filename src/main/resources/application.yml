server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/users_db
    username: ${DB_USER:cinema}
    password: ${DB_PASSWORD:cinema}

  jpa:
    hibernate:
      ddl-auto: update        # OK til start – skift til Flyway/Liquibase senere
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0: JWKS hentes automatisk fra <issuer>/.well-known/jwks.json
          issuer-uri: https://${AUTH0_DOMAIN:your-tenant.eu.auth0.com}/
          audiences: ${AUTH0_AUDIENCE:https://api.cinema.local}

app:
  auth0:
    # Access tokens fra Auth0 har ikke e-mail som standard.
    # Tilføj et custom claim med en Auth0 Action og skriv navnet her.
    email-claim: ${AUTH0_EMAIL_CLAIM:https://cinema.local/email}
    name-claim: ${AUTH0_NAME_CLAIM:https://cinema.local/name}

management:
  endpoints:
    web:
      exposure:
        include: health,info
