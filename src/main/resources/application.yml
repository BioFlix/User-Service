server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/users_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update        # OK til start – skift til Flyway/Liquibase senere
    open-in-view: false
    # Run schema.sql after Hibernate has created the tables (partial indexes Hibernate cannot make)
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN:your-tenant.eu.auth0.com}/
          audiences: ${AUTH0_AUDIENCE:https://api.cinema.local}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    publisher-confirm-type: simple

app:
  auth0:
    email-claim: ${AUTH0_EMAIL_CLAIM:https://cinema.local/email}
    name-claim: ${AUTH0_NAME_CLAIM:https://cinema.local/name}
  admin-emails: ${ADMIN_EMAILS:}
  rabbitmq:
    exchange: cinema.events
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:1000}   # ms
    batch-size: 50
    keep-published-for: 7d
  dev:
    jwt-issuer: bioflix-dev
    jwt-secret: ${DEV_JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}

management:
  endpoints:
    web:
      exposure:
        include: health,info
