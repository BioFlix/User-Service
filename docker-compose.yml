# Local development environment for user-service.
#   docker compose up --build
#
#   API:          http://localhost:8081/api/users/me   (header Authorization: Bearer <token>)
#   Dev token:    POST http://localhost:8081/api/dev/token   (profile "dev", no Auth0 needed)
#   RabbitMQ UI:  http://localhost:15672   (guest / guest)
#   Postgres:     localhost:5435  (postgres / postgres, db users_db)
#
# Real Auth0 instead of dev tokens:
#   SPRING_PROFILES_ACTIVE= AUTH0_DOMAIN=my-tenant.eu.auth0.com AUTH0_AUDIENCE=https://api.cinema.local docker compose up --build
#
# Every host port can be changed if it is already in use, e.g. USER_DB_PORT=5440 docker compose up --build
services:
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${USER_DB_PORT:-5435}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build: .
    ports:
      - "${USER_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-dev}
      DB_HOST: user-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@bioflix.local}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-your-tenant.eu.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.cinema.local}
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  user-db-data:
